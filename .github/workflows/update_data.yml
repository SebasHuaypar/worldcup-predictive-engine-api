name: Daily Data Update & Model Training

on:
  schedule:
    # Run every day at 3:00 AM UTC
    - cron: '0 3 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-data-and-train:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing commits back to the repository
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Important: need to fetch all history to push later
          fetch-depth: 0
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run Data Scraper
        run: |
          # Set the PYTHONPATH to include the current directory
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python src/data/scraper.py
          
      - name: Run Model Training
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python src/models/train.py
          
      - name: Run Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python tests/test_predict.py
          
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/database.sqlite models/model_goals.pkl
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update database and retrain model"
          git push
