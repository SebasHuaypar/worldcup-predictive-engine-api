name: Weekly Data Scraping & Model Update

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual execution from the GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows pushing commits back to the repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run data scraping and ingestion
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m src.data.scraper

    - name: Run model retraining
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m src.models.train

    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python tests/test_predict.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Check if database or models have changed
        git add data/database.sqlite models/*.pkl
        
        if git diff --staged --quiet; then
          echo "No changes in database or models. Skipping commit."
        else
          git commit -m "Auto-update: match database and predictive models [skip ci]"
          git push
        fi
